[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onpe-segunda-vuelta-scraper"
version = "0.1.0"
description = "Recurring scraper for Peru ONPE presidential runoff results"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "playwright>=1.44.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "deepdiff>=7.0.0",
    "tenacity>=8.3.0",
    "brotli>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["scraper", "models", "scripts"]
