[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:onpe-scraper]
command=.venv/bin/python main.py --daemon
directory=/Users/sergiomondragonsilva/Documents/personal/learning-test/2davuelta-webscrapping
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/tmp/onpe-scraper.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/tmp/onpe-scraper-err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
; env vars loaded automatically from .env by config.py (load_dotenv)
stopwaitsecs=10
stopsignal=TERM
